<header class="hero-section">
    <div class="hero-content">
      <h1>Cuidamos lo que más amas</h1>
      <p>En <strong>Patitas</strong>, la salud y felicidad de tu mascota son nuestra prioridad. Agenda tu cita o ingresa a tu portal.</p>
      <button class="btn-secondary">Conocer más</button>
    </div>

    <div class="login-card">
      <h2>Bienvenido</h2>
      <p>Ingresa a tu cuenta</p>
      
      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" [(ngModel)]="loginData.email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
        <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
      </form>
    </div>
  </header>
